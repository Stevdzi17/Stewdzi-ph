<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Radovi | Stevan Radojčin</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800;900&family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="cursor" id="cursor"></div>
  <div class="cursor-follower" id="cursorFollower"></div>
  <canvas id="particleCanvas"></canvas>

  <!-- HEADER -->
  <header class="header scrolled" id="header">
    <div class="logo">
      <img src="images/logo.png" alt="Stewdzi Photography Logo" />
    </div>
    <nav class="nav-links" id="navLinks">
      <a href="index.html" class="nav-link">Početna</a>
      <a href="index.html#about" class="nav-link">O meni</a>
      <a href="index.html#portfolio" class="nav-link">Portfolio</a>
      <a href="index.html#contact" class="nav-link">Kontakt</a>
    </nav>
    <div class="hamburger" id="hamburger" aria-label="Otvori meni" role="button" tabindex="0">
      <span></span><span></span><span></span>
    </div>
  </header>

  <main>

    <!-- Naslov stranice -->
    <section class="subpage-title fade-section">
      <div class="about-label">Galerija</div>
      <h1>Ostali radovi</h1>
      <p>Istraži dodatne projekte i fotografije koje nisu deo glavnog portfolija.</p>
    </section>

    <!-- FOTKANJE -->
    <section class="radovi-section fade-section" id="fotkanje">
      <h2>📸 Fotkanje</h2>
      <div class="gallery-grid">
        <div class="gallery-item tilt-card">
          <img src="images/fotkanje/1.jpg" alt="Fotkanje 1" class="lightbox-thumb" />
          <div class="gallery-overlay"><i class="fa fa-expand"></i></div>
        </div>
        <div class="gallery-item tilt-card">
          <img src="images/fotkanje/2.jpg" alt="Fotkanje 2" class="lightbox-thumb" />
          <div class="gallery-overlay"><i class="fa fa-expand"></i></div>
        </div>
        <!-- Dodaj još slika po potrebi -->
      </div>
    </section>

    <!-- PRIRODA -->
    <section class="radovi-section fade-section" id="priroda">
      <h2>🌿 Priroda</h2>
      <div class="gallery-grid">
        <div class="gallery-item tilt-card">
          <img src="images/priroda/1.jpg" alt="Priroda 1" class="lightbox-thumb" />
          <div class="gallery-overlay"><i class="fa fa-expand"></i></div>
        </div>
        <div class="gallery-item tilt-card">
          <img src="images/priroda/2.jpg" alt="Priroda 2" class="lightbox-thumb" />
          <div class="gallery-overlay"><i class="fa fa-expand"></i></div>
        </div>
        <!-- Dodaj još slika -->
      </div>
    </section>

    <!-- GRAFIČKI RADOVI -->
    <section class="radovi-section fade-section" id="grafika">
      <h2>🎨 Grafički radovi</h2>
      <div class="gallery-grid">
        <div class="gallery-item tilt-card">
          <img src="images/grafika/1.jpg" alt="Grafika 1" class="lightbox-thumb" />
          <div class="gallery-overlay"><i class="fa fa-expand"></i></div>
        </div>
        <div class="gallery-item tilt-card">
          <img src="images/grafika/2.jpg" alt="Grafika 2" class="lightbox-thumb" />
          <div class="gallery-overlay"><i class="fa fa-expand"></i></div>
        </div>
        <!-- Dodaj još slika -->
      </div>
    </section>

  </main>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true">
    <button class="lightbox-close" id="lightbox-close" aria-label="Zatvori">&times;</button>
    <img class="lightbox-img" id="lightbox-img" src="" alt="" />
    <div class="lightbox-controls">
      <button class="lightbox-prev" id="lightbox-prev" aria-label="Prethodna">&#8592;</button>
      <button class="lightbox-next" id="lightbox-next" aria-label="Sledeća">&#8594;</button>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="site-footer">
    <div class="footer-content">
      <div class="footer-logo">
        <img src="images/logo.png" alt="Stewdzi Photography" />
      </div>
      <p>&copy; 2025 Stevan Radojčin · Sva prava zadržana.</p>
      <div class="footer-socials">
        <a href="https://instagram.com/stewdzi.ph" target="_blank" rel="noopener" aria-label="Instagram">
          <i class="fa-brands fa-instagram"></i>
        </a>
        <a href="https://facebook.com/stevan.radojcin" target="_blank" rel="noopener" aria-label="Facebook">
          <i class="fa-brands fa-facebook"></i>
        </a>
        <a href="mailto:stevan.radojcin123@gmail.com" aria-label="Email">
          <i class="fas fa-envelope"></i>
        </a>
        <a href="tel:+381641284743" aria-label="Telefon">
          <i class="fas fa-phone"></i>
        </a>
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
